{# Top Bar Component with Status and Alert Bell #}
<header class="app-topbar">
  <div class="topbar-left">
    <div class="topbar-brand-mobile">
      <img src="/static/assets/anveshak_logo.png" alt="Anveshak Logo" style="width: 44px; height: 44px; object-fit: cover; border-radius: 8px; margin-left: -4px; margin-right: 4px;" />
      <span class="sidebar-title" style="font-weight: 700;">Anveshak</span>
    </div>
    <h1 class="topbar-title">{% block page_title %}{{ page_title | default("Dashboard") }}{% endblock %}</h1>
  </div>

  <div class="topbar-right">
    {# System Status Indicator (accessible: dot + text) #}
    <div class="status-pill online" id="system-status-pill" title="System Status: Normal">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="system-status-text">System Active</span>
    </div>

    {# Real Alert Bell Notification Trigger (wired to alert count) #}
    <a href="/alerts" class="alert-bell-btn" id="alert-bell" aria-label="View Active Alerts" title="Active Alerts">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
      </svg>
      <span class="alert-badge" id="alert-bell-badge" aria-live="polite">0</span>
    </a>
  </div>
</header>
